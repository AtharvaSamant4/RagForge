name: Verify RAGForge
on: [push, pull_request]
concurrency:
  group: ragforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ragforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ragforge_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ragforge -d ragforge_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-d13954661f83248295ba75c1ed411eef3b7b936e
      - run: PYTHONPATH=backend EMBEDDING_PROVIDER=semantic python -m app.model_cache
      - if: matrix.database == 'postgres'
        run: |
          echo "DATABASE_URL=postgresql+psycopg://ragforge:test-only-password@localhost:5432/ragforge_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://ragforge:test-only-password@localhost:5432/ragforge_test" >> "$GITHUB_ENV"
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest --junitxml=artifacts/backend-${{ matrix.database }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}
          path: artifacts/backend-${{ matrix.database }}.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_PORT: "8010"
      WEB_PORT: "3010"
      APP_ORIGINS: http://localhost:3010
      QA_BASE_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker compose -p ragforge-ci up --build -d
      - run: docker compose -p ragforge-ci exec -T api python -m app.model_cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Frontend API failure containment
        run: python scripts/verify-api-proxy.py --project ragforge-ci --base-url http://localhost:3010 --api-port 8010
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            artifacts/browser
            docs/qa/screenshots
            docs/qa/m4-api-proxy.json
      - if: always()
        run: docker compose -p ragforge-ci down
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_PORT: "8030"
      WEB_PORT: "3030"
      APP_ORIGINS: http://localhost:3030
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install httpx cryptography==49.0.0
      - run: mkdir -p artifacts
      - run: docker compose -p ragforge-export-ci up --build -d
      - run: python scripts/verify-standalone.py --stop-source ragforge-export-ci --output artifacts/standalone-ci.json
      - name: Encrypted standalone recovery into a separate empty deployment
        run: |
          python -c "import json,subprocess,sys; d=json.load(open('artifacts/standalone-ci.json'))['extracted_directory']; subprocess.run([sys.executable,'scripts/verify-standalone-recovery.py','--directory',d],check=True)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-runtime-evidence
          path: |
            artifacts/standalone-ci.json
            docs/qa/m4-standalone-recovery.json
      - if: always()
        run: docker compose -p ragforge-export-ci down

  private-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: python scripts/init-alpha.py
      - run: docker compose --env-file .env.alpha -p ragforge-m4-alpha -f compose.yaml -f compose.alpha.yaml up --build -d
      - run: python scripts/prepare-alpha-qa.py
      - name: Encrypted hosted recovery and bounded requests
        run: python scripts/verify-private-alpha.py
      - run: python scripts/prepare-alpha-qa.py
      - name: Desktop and mobile HTTPS alpha workflows
        env:
          QA_ALPHA: "1"
          QA_BASE_URL: https://localhost:8443
        run: npm --prefix frontend run test:e2e -- alpha.spec.ts
      - name: Prepare synthetic pilot fixtures with default-off study consent
        run: python scripts/prepare-pilot-qa.py --project ragforge-m4-alpha --base-url https://localhost:8443 --env-file .env.alpha --admin-file artifacts/m4-private-credentials.json
      - name: Actual independent runtime evidence with source offline
        run: python scripts/verify-pilot-runtime.py
      - name: Pilot consent, feedback, triage, privacy deletion and proof browser workflows
        env:
          QA_ALPHA: "1"
          QA_PILOT: "1"
          QA_BASE_URL: https://localhost:8443
        run: npm --prefix frontend run test:e2e -- pilot.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-alpha-evidence
          path: |
            docs/qa/m4-hosted-recovery-load.json
            docs/qa/screenshots/alpha-*.png
            docs/qa/screenshots/m5
            docs/qa/m5-pilot-runtime.json
            docs/qa/m5-standalone-acceptance.json
            artifacts/browser/results.json
      - if: always()
        run: |
          docker compose --env-file .env.alpha -p ragforge-m4-alpha -f compose.yaml -f compose.alpha.yaml down
          docker compose -p ragforge-m4-restore down

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install httpx
      - name: Exact remote clone, uncached dependencies and empty model/database volumes
        run: python scripts/verify-clean-install.py --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-evidence
          path: |
            docs/qa/m5-clean-install.json
            docs/qa/m5-clean-standalone-acceptance.json
            artifacts/m5-clean-install-commands.log
