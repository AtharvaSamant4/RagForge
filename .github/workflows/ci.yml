name: Verify RAGForge
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ragforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ragforge_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ragforge -d ragforge_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-d13954661f83248295ba75c1ed411eef3b7b936e
      - run: PYTHONPATH=backend EMBEDDING_PROVIDER=semantic python -m app.model_cache
      - if: matrix.database == 'postgres'
        run: |
          echo "DATABASE_URL=postgresql+psycopg://ragforge:test-only-password@localhost:5432/ragforge_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://ragforge:test-only-password@localhost:5432/ragforge_test" >> "$GITHUB_ENV"
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      API_PORT: "8010"
      WEB_PORT: "3010"
      APP_ORIGINS: http://localhost:3010
      QA_BASE_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker compose -p ragforge-ci up --build -d
      - run: docker compose -p ragforge-ci exec -T api python -m app.model_cache
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            artifacts/browser
            docs/qa/screenshots
      - if: always()
        run: docker compose -p ragforge-ci down
