services:
  db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: standalone
      POSTGRES_DB: standalone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standalone -d standalone"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: ${DB_MEMORY:-512m}
    cpus: ${DB_CPUS:-1.0}
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://standalone:${POSTGRES_PASSWORD}@db:5432/standalone
      STORAGE_DIR: /runtime/uploads
      MODEL_CACHE_DIR: /runtime/models
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
    ports:
      - "127.0.0.1:${API_PORT:-8020}:8000"
    volumes:
      - runtime:/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: ${API_MEMORY:-768m}
    cpus: ${API_CPUS:-2.0}
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://standalone:${POSTGRES_PASSWORD}@db:5432/standalone
      STORAGE_DIR: /runtime/uploads
      MODEL_CACHE_DIR: /runtime/models
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-2}
    volumes:
      - runtime:/runtime
    depends_on:
      api:
        condition: service_healthy
    mem_limit: ${WORKER_MEMORY:-1g}
    cpus: ${WORKER_CPUS:-2.0}
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
volumes:
  database:
  runtime:
