name: ragforge
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-ragforge-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ragforge:${POSTGRES_PASSWORD:-local-ragforge-change-me}@db:5432/ragforge
      STORAGE_DIR: /app/data/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-semantic}
      MODEL_CACHE_DIR: /app/data/models
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/data/uploads
      - model_cache:/app/data/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ragforge:${POSTGRES_PASSWORD:-local-ragforge-change-me}@db:5432/ragforge
      STORAGE_DIR: /app/data/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-semantic}
      MODEL_CACHE_DIR: /app/data/models
    volumes:
      - uploads:/app/data/uploads
      - model_cache:/app/data/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
  model_cache:
