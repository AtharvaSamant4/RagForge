# Private-alpha overlay: docker compose -p ragforge-alpha -f compose.yaml -f compose.alpha.yaml up --build -d
# Requires ALPHA_HOST, ALPHA_ORIGIN and a fresh POSTGRES_PASSWORD in a private env file.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize private alpha secrets first}
    mem_limit: 512m
    cpus: 1.0
    logging: &alpha-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  api:
    environment: &alpha-environment
      DEPLOYMENT_MODE: private_alpha
      REGISTRATION_MODE: invite
      ALLOW_REGISTRATION: "false"
      COOKIE_SECURE: "true"
      APP_ORIGINS: ${ALPHA_ORIGIN:-https://localhost:8443}
      ALLOW_PUBLIC_WIDGETS: "false"
      USER_STORAGE_MB: "256"
      MAX_PROJECTS_PER_USER: "10"
      MAX_DOCUMENTS_PER_PROJECT: "50"
      MAX_INGESTION_JOBS_PER_USER: "4"
      MAX_INGESTION_PROCESSES: "2"
      MAX_EXPORT_JOBS_PER_USER: "1"
      SESSION_TTL_SECONDS: "86400"
      API_KEY_TTL_DAYS: "30"
      JOB_LEASE_SECONDS: "300"
      PARSER_REQUIRE_SANDBOX: "true"
      PARSER_WALL_SECONDS: "15"
      PARSER_CPU_SECONDS: "10"
      PARSER_MEMORY_MB: "512"
      HOSTED_DAILY_REQUESTS: "0"
      HOSTED_DAILY_INPUT_CHARS: "200000"
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging: *alpha-logs
  worker:
    environment: *alpha-environment
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    logging: *alpha-logs
  web:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *alpha-logs
  proxy:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      ALPHA_HOST: ${ALPHA_HOST:-localhost}
    ports:
      - "127.0.0.1:${ALPHA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - alpha_tls:/data
      - alpha_proxy_config:/config
    depends_on:
      web:
        condition: service_started
    mem_limit: 128m
    cpus: 0.5
    logging: *alpha-logs
volumes:
  alpha_tls:
  alpha_proxy_config:
